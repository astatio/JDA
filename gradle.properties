org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true
org.gradle.jvmargs=-Xmx1G "-XX:MaxMetaspaceSize=512m"
org.gradle.parallel=true
# The Kotlin plugin otherwise adds kotlin-stdlib as an implementation dependency, which would
# change the published POM for every downstream consumer. No Kotlin is on the public API yet;
# re-enable this when the first Kotlin type becomes part of it.
kotlin.stdlib.default.dependency=false
